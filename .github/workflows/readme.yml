name: Update README pulse

on:
  schedule:
    # Runs daily at 06:15 UTC (~1am Bogota)
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update now block
        run: node scripts/update-now.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if [[ -n $(git status --porcelain README.md) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: readme pulse $(date -u +%Y-%m-%d)"
            git push
          fi
