<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="terminal: curl mdingest api">
  <rect width="780" height="218" rx="12" fill="#16130e" stroke="#383125"/>
  <circle cx="30" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="28" r="6" fill="#febc2e"/>
  <circle cx="70" cy="28" r="6" fill="#28c840"/>
  <text x="390" y="32" text-anchor="middle" font-size="12" fill="#9c937e">luis@dev ~ zsh</text>

  <clipPath id="type">
    <rect x="24" y="48" width="0" height="26">
      <animate attributeName="width" values="0;40;80;120;160;200;240;280;320;370;410;440" keyTimes="0;0.09;0.18;0.27;0.36;0.45;0.55;0.64;0.73;0.82;0.91;1" dur="1.6s" begin="0.7s" fill="freeze" calcMode="discrete"/>
    </rect>
  </clipPath>
  <text x="24" y="68" font-size="14" clip-path="url(#type)"><tspan fill="#e8895a">$</tspan><tspan fill="#efe9da"> curl https://mdingest.knightker.workers.dev/v1</tspan></text>

  <text x="24" y="100" font-size="14" fill="#efe9da" opacity="0"><set attributeName="opacity" to="1" begin="2.3s"/>{"name":"mdingest","version":"v1","endpoints":{...}}</text>
  <text x="24" y="128" font-size="14" fill="#7fb069" opacity="0"><set attributeName="opacity" to="1" begin="2.8s"/>200 OK · 3 providers · live on cloudflare workers</text>
  <text x="24" y="156" font-size="14" fill="#9c937e" opacity="0"><set attributeName="opacity" to="1" begin="3.3s"/># try it: real api, real markdown out</text>

  <text x="24" y="192" font-size="14"><tspan fill="#e8895a">$</tspan><tspan fill="#efe9da"> </tspan><tspan fill="#e8895a" opacity="0">&#9612;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" begin="3.8s" repeatCount="indefinite"/></tspan></text>
</svg>
